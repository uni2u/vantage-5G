# Test scrape config. 1 s scrape so the dashboard's shortest rate windows (5s) work;
# production: see dashboards/README.md.
global:
  scrape_interval: 1s
  evaluation_interval: 5s
scrape_configs:
  - job_name: vantage-5g      # dashboard 'Exporter scrape' panel selects up{job="vantage-5g"}
    static_configs:
      - targets: ["host.docker.internal:19090"]
        labels: {node: l2-vantage-svc}

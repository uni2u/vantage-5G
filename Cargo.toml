[package]
name = "vantage-5G"
version = "0.2.0"
edition = "2021"
# std File::try_lock (writer lock, Q8-2) is stable since 1.89.
rust-version = "1.89"

[dependencies]
anyhow = "1.0"
clap = { version = "4.4", features = ["derive"] }

libbpf-sys = "1.4"
libbpf-rs  = "0.23"

lazy_static = "1.4"
prometheus = "0.13"
prometheus_exporter = "0.8"
